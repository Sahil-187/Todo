<div class="my-3">
    <h2>Add Todo</h2>
    <form [formGroup]="todoItem" (ngSubmit)="onSubmit()">
        <div class="form-group my-4">
            <label for="title">Todo Title</label>
            <input type="text" formControlName="title" class="form-control" id="title" placeholder="Enter todo title">
        </div>
        <div class="form-group">
            <label for="description">Todo Description</label>
            <input type="text" formControlName="desc"  class="form-control" id="desc" placeholder="Enter todo description">
        </div>
        <button type="submit" class="btn btn-sm btn-primary my-4">Add Todo</button>
    </form>
</div>
