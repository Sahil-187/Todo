<div>
    <hr>
    <h3 [ngClass]="{'strike' : !todo.active}">{{ todo.title }}</h3>
    <p [ngClass]="{'strike' : !todo.active}">{{ todo.desc}}</p>
    <div class="form-group form-check">
        <input type="checkbox" class="form-check-input" id="check" [checked]="!todo.active" (change)="toggleDone()" />
        <label class="form-check-label" for="check">Done</label>
    </div>
    <button class="btn btn-danger" (click)="deleteTodo()">Delete</button>
</div>

<style>
    .strike {
        text-decoration: line-through;
    }
</style>
